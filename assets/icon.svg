<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d52ff"/>
      <stop offset="1" stop-color="#22175c"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcdff0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#f0a91c"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7183"/>
      <stop offset="1" stop-color="#e3344a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b0627" flood-opacity=".45"/>
    </filter>
    <!-- Lücke rund um den Strich -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <line x1="376" y1="176" x2="136" y2="416" stroke="#000" stroke-width="58" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <g transform="translate(0 24)" filter="url(#shadow)">
    <g mask="url(#cut)">
      <!-- Krone -->
      <path d="M206 120 L194 76 L231 101 L256 64 L281 101 L318 76 L306 120 Z"
            fill="url(#gold)" stroke-linejoin="round"/>
      <rect x="204" y="118" width="104" height="16" rx="5" fill="url(#gold)"/>
      <circle cx="194" cy="74" r="8" fill="#ffe7a3"/>
      <circle cx="256" cy="60" r="9" fill="#ffe7a3"/>
      <circle cx="318" cy="74" r="8" fill="#ffe7a3"/>
      <!-- Kopfhörer -->
      <path d="M138 304 V280 A118 118 0 0 1 374 280 V304" fill="none"
            stroke="url(#white)" stroke-width="30" stroke-linecap="round"/>
      <rect x="114" y="280" width="74" height="122" rx="30" fill="url(#white)"/>
      <rect x="324" y="280" width="74" height="122" rx="30" fill="url(#white)"/>
    </g>
    <!-- Strich -->
    <line x1="376" y1="176" x2="136" y2="416" stroke="url(#red)" stroke-width="28" stroke-linecap="round"/>
  </g>
</svg>
